syntax = "proto3";
import "google/protobuf/empty.proto";

option csharp_namespace = "ReLiveWP.Services.Grpc";

package client_provisioning;

service ClientProvisioning {
  rpc ProvisionDevice (DeviceProvisioningRequest) returns (DeviceProvisioningResponse);
}

message DeviceProvisioningRequest {
  bytes certificateRequest = 1;
  string version = 2;
}

message DeviceProvisioningResponse {
  bool succeeded = 1;
  bytes certificate = 2;
}
