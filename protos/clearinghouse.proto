syntax = "proto3";

option csharp_namespace = "ReLiveWP.Services.Grpc.ClearingHouse";

package clearinghouse;

service ClearingHouse {
  rpc SyncNow (SyncNowRequest) returns (SyncStatus);
  rpc SetSync (SetSyncRequest) returns (SyncStatus);
  rpc GetSync (GetSyncRequest) returns (GetSyncResponse);
}

enum SyncKind {
  SYNC_KIND_CONTACTS = 0;
  SYNC_KIND_CALENDAR = 1;
}

message SyncNowRequest {
  SyncKind kind          = 1;
  string   connection_id = 2;
}

message SetSyncRequest {
  SyncKind kind          = 1;
  string   connection_id = 2;
  bool     enabled       = 3;
}

message GetSyncRequest {
  optional SyncKind kind          = 1;
  optional string   connection_id = 2;
}

message GetSyncResponse {
  repeated SyncStatus connections = 1;
}

message SyncStatus {
  SyncKind kind          = 1;
  string   connection_id = 2;
  string   service_id    = 3;

  bool     enabled       = 4;
  bool     running       = 5;
  bool     queued        = 6;

  optional string last_synced_at = 7;
  optional string last_failure   = 8;

  int32 created = 9;
  int32 updated = 10;
  int32 deleted = 11;
  int32 skipped = 12;
}
