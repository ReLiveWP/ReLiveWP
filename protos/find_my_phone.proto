syntax = "proto3";
import "google/protobuf/empty.proto";

option csharp_namespace = "ReLiveWP.Services.Grpc.FindMyPhone";

package find_my_phone;

service FindMyPhone {
  rpc RegisterDevice (RegisterDeviceRequest) returns (RegisterDeviceResponse);
  rpc UpdateDeviceInfo (UpdateDeviceInfoRequest) returns (UpdateDeviceInfoResponse);
  rpc GetDevicesForUser(GetDevicesForUserRequest) returns (stream UserDevice);
}

message RegisterDeviceRequest {
	string userId = 1;
	string deviceGuid = 2;
	map<string, string> device_props = 3; 
}

message RegisterDeviceResponse {
	int32 code = 1;
	string message = 2;
	bool enabled = 3;
}

message UpdateDeviceInfoRequest {
	string userId = 1;
	string deviceGuid = 2;
	map<string, string> device_props = 3; 
}

message UpdateDeviceInfoResponse {
	int32 code = 1;
	string message = 2;
	bool enabled = 3;
}

message GetDevicesForUserRequest {
	string userId = 1;
}

message UserDevice {
	optional string manufacturer = 1;
	optional string model = 2;
	optional string operator = 3;
	optional string phone_number = 4;

	string osVersion = 5;
	string locale = 6;
	string uniqueId = 7;
	string friendlyName = 8;

	optional int32 colour_theme = 9;
	optional string accent_colour = 10;
	optional int32 lcid = 11;
	optional string timezone = 12;

	optional int32 battery_level = 13;
	optional int64 storage_remaining = 14;
	optional bool pin_locked = 15;
	optional bool sim_locked = 16;
}