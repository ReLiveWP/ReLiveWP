syntax = "proto3";

option csharp_namespace = "ReLiveWP.Services.Grpc";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

package identity;

service Authentication {
  rpc Register (RegisterRequest) returns (RegisterResponse);
  rpc RegisterDevice (RegisterDeviceRequest) returns (RegisterDeviceResponse);
  rpc GetSecurityTokens (SecurityTokensRequest) returns (SecurityTokensResponse);
  rpc GetDeviceCertificate (DeviceCertificateRequest) returns (DeviceCertificateResponse);
 
  rpc ChangePassword(ChangePasswordRequest) returns (google.protobuf.Empty);

  rpc RefreshSecurityTokens (RefreshTokensRequest) returns (SecurityTokensResponse);

  rpc VerifySecurityToken (VerifyTokenRequest) returns (VerifyResponse);
  rpc VerifyPassword (VerifyPasswordRequest) returns (VerifyResponse);
  rpc VerifyDeviceCertificate (VerifyDeviceCertificateRequest) returns (VerifyDeviceCertificateResponse);
}

message RegisterRequest {
  string username = 1;
  string emailAddress = 2;
  string password = 3;
}

message RegisterResponse {
  uint32 code = 1;
  optional string id = 2;
  optional int64 puid = 3;
  optional string cid = 4;
}

message RegisterDeviceRequest {
  string deviceId = 1;
  string username = 2;
  string password = 3;
  repeated SecurityTokenRequest requests = 4;
}

message RegisterDeviceResponse {
  uint32 code = 1;
  optional string id = 2;
  optional int64 puid = 3;
  optional string cid = 4;
  repeated SecurityTokenResponse tokens = 5;
}

message SecurityTokenRequest {
  string serviceTarget = 1;
  string servicePolicy = 2;
  optional bytes supportingData = 3;
}

message SecurityTokensRequest {
  string username = 1;
  string password = 2;
  repeated SecurityTokenRequest requests = 3;
  
  string authToken = 4;
  bool issueRefreshToken = 5;
  string deviceAuthToken = 6;
}

message RefreshTokensRequest {
  repeated string refreshTokens = 1;
}

message SecurityTokenResponse {
  string serviceTarget = 1;
  string token = 2;
  string tokenType = 3;

  google.protobuf.Timestamp created = 4;
  google.protobuf.Timestamp expires = 5;

  optional string refreshToken = 6;
  optional google.protobuf.Timestamp refreshTokenExpires = 7;
  optional uint32 code = 8;

  optional bytes proofKey = 9;
}

message SecurityTokensResponse {
  uint32 code = 1;
  string id = 8;
  int64 puid = 2;
  string cid = 3;
  string username = 4;
  string emailAddress = 5;
  repeated SecurityTokenResponse tokens = 6;
  optional bytes sessionKey = 7;
  optional string deviceId = 9;
}

message ClaimMessage {
  string type = 1;
  string value = 2;
}

message VerifyTokenRequest {
  repeated string serviceTargets = 1;
  string token = 2;
  string tokenType = 3; 
}

message VerifyResponse {
  uint32 code = 1;
  string id = 3;
  repeated ClaimMessage claims = 2;
}

message DeviceCertificateRequest {
  bytes certificateRequest = 1;
  string puid = 2;
}

message DeviceCertificateResponse {
  bool succeeded = 1;
  bytes certificate = 2;
}

message VerifyDeviceCertificateRequest {
	bytes certificate = 1;
}

message VerifyDeviceCertificateResponse {
  bool succeeded = 1;
  optional string id = 7;
  optional int64 puid = 2;
  optional string cid = 3;
  optional string username = 4;
  optional string emailAddress = 5;
  optional string deviceId = 6;
}

message VerifyPasswordRequest {
	optional string username = 1;
	optional string emailAddress = 3;
	string password = 2;
}

message ChangePasswordRequest {
	optional string uid = 1;
	optional string puid = 2; // DeviceChangeCredental looks up bu puid 
	string oldPassword = 3;
	string newPassword = 4;
}
