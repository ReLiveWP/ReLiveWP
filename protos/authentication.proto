syntax = "proto3";

option csharp_namespace = "ReLiveWP.Services.Grpc";

import "google/protobuf/timestamp.proto";

package identity;

service Authentication {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc RegisterDevice(RegisterDeviceRequest) returns (RegisterDeviceResponse);
  rpc GetSecurityTokens (SecurityTokensRequest) returns (SecurityTokensResponse);
  rpc VerifySecurityToken (VerifyTokenRequest) returns (VerifyTokenResponse);
  rpc GetDeviceCertificate (DeviceCertificateRequest) returns (DeviceCertificateResponse);
}

message RegisterRequest {
  string username = 1;
  string emailAddress = 2;
  string password = 3;
}

message RegisterResponse {
  uint32 code = 1;
  optional string id = 2;
  optional int64 puid = 3;
  optional string cid = 4;
}

message RegisterDeviceRequest {
  string deviceId = 1;
  string username = 2;
  string password = 3;
  repeated SecurityTokenRequest requests = 4;
}

message RegisterDeviceResponse {
  uint32 code = 1;
  optional string id = 2;
  optional int64 puid = 3;
  optional string cid = 4;
  repeated SecurityTokenResponse tokens = 5;
}

message SecurityTokenRequest {
  string serviceTarget = 1;
  string servicePolicy = 2;
}

message SecurityTokensRequest {
  string username = 1;
  string password = 2;

  string authToken = 4;

  repeated SecurityTokenRequest requests = 3;
}

message SecurityTokenResponse {
  string serviceTarget = 1;
  string token = 2;
  optional string refreshToken = 6;
  string tokenType = 3; 

  google.protobuf.Timestamp created = 4;
  google.protobuf.Timestamp expires = 5;
}

message SecurityTokensResponse {
  uint32 code = 1;
  int64 puid = 2;
  string cid = 3;
  string username = 4;
  string emailAddress = 5;
  repeated SecurityTokenResponse tokens = 6;
}

message ClaimMessage {
  string type = 1;
  string value = 2;
}

message VerifyTokenRequest {
  repeated string serviceTargets = 1;
  string token = 2;
  string tokenType = 3; 
}

message VerifyTokenResponse {
  uint32 code = 1;
  repeated ClaimMessage claims = 2;
}

message DeviceCertificateRequest {
  bytes certificateRequest = 1;
  string puid = 2;
}

message DeviceCertificateResponse {
  bool succeeded = 1;
  bytes certificate = 2;
}
