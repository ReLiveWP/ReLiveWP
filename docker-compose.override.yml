---
name: relivewp

x-dev-env:
  &dev-env
  ASPNETCORE_ENVIRONMENT: Development
  NODE_ENV: development

services:
  identity:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: ReLiveWP.Backend.Identity
    environment: *dev-env

  connectedservices:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: ReLiveWP.Backend.ConnectedServices
    environment: *dev-env

  deviceregistration:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: ReLiveWP.Backend.DeviceRegistration
    environment: *dev-env

  skybox:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: ReLiveWP.Backend.Skybox
    environment: *dev-env

  activation:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: ReLiveWP.Services.Activation
    environment: *dev-env

  login:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: ReLiveWP.Services.Login
    environment: *dev-env

  web:
    build:
      context: .
      dockerfile: ReLiveWP.Web/Dockerfile
      args:
        CLIENT_BUILD_SCRIPT: build:local
    environment: *dev-env

  push:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: ReLiveWP.Services.Push
    environment: *dev-env

  activity:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: ReLiveWP.Services.Activity
    environment: *dev-env

  exchange:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: ReLiveWP.Services.Exchange
    environment: *dev-env

  addressbook:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: ReLiveWP.Services.AddressBook
    environment: *dev-env

  devices:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: ReLiveWP.Services.Devices
    environment: *dev-env

  findmyphone:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: ReLiveWP.Services.FindMyPhone
    environment: *dev-env

  orion:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: ReLiveWP.Services.Orion
    environment: *dev-env

  dnsmasq:
    image: alpine:latest
    command: >
      sh -c "apk add --no-cache dnsmasq &&
             dnsmasq --no-daemon --conf-file=/etc/dnsmasq.conf"
    networks:
      - relive
    ports:
      - "127.0.0.1:5354:5354/udp"
    volumes:
      - ./deploy/dnsmasq.conf:/etc/dnsmasq.conf:ro

  nginx:
    image: nginx:alpine
    networks:
      - relive
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - login
      - devices
      - web
