---
name: relivewp

x-dev-env:
  &dev-env
  ASPNETCORE_ENVIRONMENT: Development
  NODE_ENV: development

# Allow Visual Studio's vsdbg to ptrace/attach to the dotnet process. The
# default Docker seccomp profile blocks ptrace, so debugging fails without this.
x-debug:
  &debug
  cap_add:
    - SYS_PTRACE
  security_opt:
    - seccomp:unconfined

services:
  postgres:
    ports:
      - 15432:5432

  identity:
    <<: *debug
    build:
      args:
        CONFIGURATION: Debug
    environment: *dev-env

  connectedservices:
    <<: *debug
    build:
      args:
        CONFIGURATION: Debug
    environment: *dev-env

  deviceregistration:
    <<: *debug
    build:
      args:
        CONFIGURATION: Debug
    environment: *dev-env

  skybox:
    <<: *debug
    build:
      args:
        CONFIGURATION: Debug
    environment: *dev-env

  skydrive:
    <<: *debug
    build:
      args:
        CONFIGURATION: Debug
    environment: *dev-env

  activation:
    <<: *debug
    build:
      args:
        CONFIGURATION: Debug
    environment: *dev-env

  login:
    <<: *debug
    build:
      args:
        CONFIGURATION: Debug
    environment: *dev-env

  web:
    build:
      args:
        CLIENT_BUILD_SCRIPT: build:local
    environment: *dev-env

  push:
    <<: *debug
    build:
      args:
        CONFIGURATION: Debug
    environment: *dev-env

  activity:
    <<: *debug
    build:
      args:
        CONFIGURATION: Debug
    environment: *dev-env

  exchange:
    <<: *debug
    build:
      args:
        CONFIGURATION: Debug
    environment: *dev-env

  addressbook:
    <<: *debug
    build:
      args:
        CONFIGURATION: Debug
    environment: *dev-env

  devices:
    <<: *debug
    build:
      args:
        CONFIGURATION: Debug
    environment: *dev-env

  findmyphone:
    <<: *debug
    build:
      args:
        CONFIGURATION: Debug
    environment: *dev-env

  orion:
    <<: *debug
    build:
      args:
        CONFIGURATION: Debug
    environment: *dev-env

  dnsmasq:
    image: alpine:latest
    command: >
      sh -c "apk add --no-cache dnsmasq &&
             dnsmasq --no-daemon --conf-file=/etc/dnsmasq.conf"
    networks:
      - relive
    ports:
      - "127.0.0.1:5354:5354/udp"
    volumes:
      - ./deploy/dnsmasq.conf:/etc/dnsmasq.conf:ro

  nginx:
    image: nginx:alpine
    ports:
      - "0.0.0.0:8086:80"
