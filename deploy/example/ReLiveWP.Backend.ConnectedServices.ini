[Kestrel:Endpoints:Grpc]
Url=http://0.0.0.0:5000
Protocols=Http2

[Kestrel:Endpoints:Http]
Url=http://0.0.0.0:5001
Protocols=Http1

; ConnectionStrings:DefaultConnection is supplied via the ConnectionStrings__DefaultConnection docker secret
; ConnectedServices:Secrets:ConnectionKey is supplied via the connection_secret_key docker secret

; register your own apps and drop the ids in here, the redirect urls have to match what you
; registered with each provider. atproto has no client secret, the ClientId is a url the
; provider fetches, so it has to be publicly reachable and list the same redirect.

[ConnectedServices:AtProto]
ClientId=https://login.relivewp.net/oauth-client-metadata.json
RedirectUrl=https://login.relivewp.net/oauth/callback/atproto

[ConnectedServices:Google]
ClientId=
ClientSecret=
RedirectUrl=https://login.relivewp.net/oauth/callback/google

[ConnectedServices:Microsoft]
ClientId=
ClientSecret=
RedirectUrl=https://login.relivewp.net/oauth/callback/microsoft
