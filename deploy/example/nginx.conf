        proxy_set_header X-Real-IP $remote_addr;
      }
  }

  server {
      server_name tuners.zest.int.relivewp.net;
      listen 80; listen [::]:80;
      location / {
        set $upstream tuners:8080;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }
  }
}
