events {}

http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  map $request_method $cors_method {
    OPTIONS 204;
    default 0;
  }

  map $http_origin $eas_cors_origin {
    default                         "";
    "https://mail.int.relivewp.net" $http_origin;
    "http://mail.int.relivewp.net"  $http_origin;
    "http://localhost:8083"         $http_origin;
  }

  map "$eas_cors_origin|$http_access_control_request_method" $eas_cors_preflight {
    default            0;
    "~^[^|]+\|[^|]+$"  1;
  }

  map $eas_cors_origin $eas_cors_expose {
    default "";
    "~."    "MS-ASProtocolVersions, MS-ASProtocolCommands, Content-Type, Content-Length, Content-Range, Accept-Ranges";
  }

  map $http_origin $login_cors_origin {
    default                         "";
    "https://relivewp.net"          $http_origin;
    "https://mail.relivewp.net"     $http_origin;
    "https://int.relivewp.net"      $http_origin;
    "https://mail.int.relivewp.net" $http_origin;
    "http://localhost:8081"         $http_origin;
    "http://localhost:8083"         $http_origin;
  }

  # list from https://www.cloudflare.com/ips/.
  geo $from_cloudflare {
    default          0;
    173.245.48.0/20  1;
    103.21.244.0/22  1;
    103.22.200.0/22  1;
    103.31.4.0/22    1;
    141.101.64.0/18  1;
    108.162.192.0/18 1;
    190.93.240.0/20  1;
    188.114.96.0/20  1;
    197.234.240.0/22 1;
    198.41.128.0/17  1;
    162.158.0.0/15   1;
    104.16.0.0/13    1;
    104.24.0.0/14    1;
    172.64.0.0/13    1;
    131.0.72.0/22    1;
    2400:cb00::/32   1;
    2606:4700::/32   1;
    2803:f800::/32   1;
    2405:b500::/32   1;
    2405:8100::/32   1;
    2a06:98c0::/29   1;
    2c0f:f248::/32   1;
  }

  map $from_cloudflare $cf_client_ip {
    default "";
    1       $http_cf_connecting_ip;
  }

  map $cf_client_ip $client_ip {
    default $cf_client_ip;
    ""      $remote_addr;
  }

  server {
    listen 80;
    server_name login.int.relivewp.net;
    location / {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $login_cors_origin;
        add_header Vary Origin;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type";
        return 204;
      }
      add_header Access-Control-Allow-Origin $login_cors_origin always;
      add_header Vary Origin always;
      set $upstream login:10002;
      proxy_pass http://$upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $client_ip;
      proxy_set_header CF-Connecting-IP $client_ip;
      proxy_set_header X-Forwarded-For $client_ip;
      proxy_set_header X-Forwarded-Proto https;
    }
  }

  server {
    listen 80;
    server_name hub.int.relivewp.net;
    location / {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type";
        return 204;
      }
      add_header Access-Control-Allow-Origin * always;
      set $upstream hub:10020;
      proxy_pass http://$upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 80;
    server_name devices.int.relivewp.net;
    location / {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type";
        return 204;
      }
      add_header Access-Control-Allow-Origin * always;
      set $upstream devices:10011;
      proxy_pass http://$upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 24h;
    }
  }

  server {
    listen 80;
    server_name api.live.int.relivewp.net;

    # increase the maximum size for images
    client_max_body_size 32m;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    location / {
      set $upstream activity:10007;
      proxy_pass http://$upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 80;
    server_name docs.int.relivewp.net;

    # documents can be large, and PROPFIND is not a verb nginx buffers usefully
    client_max_body_size 128m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    location / {
      set $upstream docs:10016;
      proxy_pass http://$upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 80;
    server_name services.int.relivewp.net;
    location / {
      set $upstream findmyphone:10012;
      proxy_pass http://$upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 80;
    server_name push.int.relivewp.net;
    location / {
      set $upstream push:10005;
      proxy_pass http://$upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 80;
    server_name gateway.messenger.hotmail-int.com;
    location / {
      set $upstream messenger:10015;
      proxy_pass http://$upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 80;
    server_name dcs.int.relivewp.net;
    location / {
      set $upstream activation:10000;
      proxy_pass http://$upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 80;
    server_name contacts.int.relivewp.net;
    location / {
      set $upstream addressbook:10010;
      proxy_pass http://$upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 80;
    server_name appserver.bing.int.relivewp.net;
    location / {
      set $upstream appserver:10019;
      proxy_pass http://$upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 80;
    server_name sync.int.relivewp.net;
    proxy_read_timeout 24h;
    location / {
      if ($eas_cors_preflight) {
        add_header Access-Control-Allow-Origin  $eas_cors_origin always;
        add_header Vary                         "Origin" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, MS-ASProtocolVersion, MS-ASAcceptMultiPart, X-MS-PolicyKey" always;
        add_header Access-Control-Max-Age       "86400" always;
        return 204;
      }

      add_header Access-Control-Allow-Origin   $eas_cors_origin always;
      add_header Vary                          "Origin" always;
      add_header Access-Control-Expose-Headers $eas_cors_expose always;

      set $upstream exchange:10008;
      proxy_pass http://$upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 80;
    server_name int.relivewp.net;
    location / {
      set $upstream web:8080;
      proxy_pass http://$upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 80;
    server_name mail.int.relivewp.net;
    location / {
      set $upstream webmail:8080;
      proxy_pass http://$upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 80;
    server_name support.int.relivewp.net;
    location / {
      set $upstream support:10017;
      proxy_pass http://$upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 80;
    server_name zest.int.relivewp.net catalog.zest.int.relivewp.net;
    location / {
      set $upstream catalog:8080;
      proxy_pass http://$upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 80;
    server_name login.zest.int.relivewp.net;
    location / {
      set $upstream zunelogin:8080;
      proxy_pass http://$upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
      server_name image.catalog.zest.int.relivewp.net;
      listen 80; listen [::]:80;
      location / {
        set $upstream catalog-image:8080;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }
  }

  server {
      server_name commerce.zest.int.relivewp.net;
      listen 80; listen [::]:80;
      location / {
        set $upstream commerce:8080;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }
  }

  server {
      server_name inbox.zest.int.relivewp.net;
      listen 80; listen [::]:80;
      location / {
        set $upstream inbox:8080;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }
  }

  server {
      server_name mix.zest.int.relivewp.net;
      listen 80; listen [::]:80;
      location / {
        set $upstream mix:8080;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }
  }

  server {
      server_name social.zest.int.relivewp.net;
      listen 80; listen [::]:80;
      location / {
        set $upstream socialapi:8080;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }
  }

  server {
      server_name tuners.zest.int.relivewp.net;
      listen 80; listen [::]:80;
      location / {
        set $upstream tuners:8080;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }
  }
}
