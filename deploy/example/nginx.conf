        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }
  }

  server {
      server_name inbox.zest.int.relivewp.net;
      listen 80; listen [::]:80;
      location / {
        set $upstream inbox:8080;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }
  }

  server {
      server_name mix.zest.int.relivewp.net;
      listen 80; listen [::]:80;
      location / {
        set $upstream mix:8080;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }
  }

  server {
      server_name social.zest.int.relivewp.net;
      listen 80; listen [::]:80;
      location / {
        set $upstream socialapi:8080;
        proxy_pass http://$upstream;
