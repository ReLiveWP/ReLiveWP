events {}

http {
  map $request_method $cors_method {
    OPTIONS 204;
    default 0;
  }

  # allowlist rather than '*': this vhost fronts the entire mailbox
  map $http_origin $eas_cors_origin {
    default                     "";
    "https://mail.relivewp.net" $http_origin;
  }

  # 1 only when the origin is allowlisted AND ACRM is present. '|' cannot appear in either.
  map "$eas_cors_origin|$http_access_control_request_method" $eas_cors_preflight {
    default            0;
    "~^[^|]+\|[^|]+$"  1;
  }

  # empty for device traffic, so their responses carry no Access-Control-* headers at all
  map $eas_cors_origin $eas_cors_expose {
    default "";
    "~."    "MS-ASProtocolVersions, MS-ASProtocolCommands, Content-Type, Content-Length, Content-Range, Accept-Ranges";
  }

  server {
    listen 80;
    server_name login.relivewp.net;
    location / {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type";
        return 204;
      }
      add_header Access-Control-Allow-Origin * always;
      proxy_pass http://login:10002;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 80;
    server_name devices.relivewp.net;
    location / {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type";
        return 204;
      }
      add_header Access-Control-Allow-Origin * always;
      proxy_pass http://devices:10011;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 24h;
    }
  }

  server {
    listen 80;
    server_name hub.relivewp.net;
    location / {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type";
        return 204;
      }
      add_header Access-Control-Allow-Origin * always;
      proxy_pass http://hub:10020;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 24h;
    }
  }

  server {
    listen 80;
    server_name api.live.relivewp.net;
    
    # increase the maximum size for images
    client_max_body_size 32m;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    location / {
      proxy_pass http://activity:10007;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 80;
    server_name appserver.bing.relivewp.net;
    location / {
      proxy_pass http://appserver:10001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 80;
    server_name docs.relivewp.net;

    # documents can be large, and PROPFIND is not a verb nginx buffers usefully
    client_max_body_size 128m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    location / {
      proxy_pass http://docs:10016;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 80;
    server_name services.relivewp.net;
    location / {
      proxy_pass http://findmyphone:10012;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 80;
    server_name push.relivewp.net;
    location / {
      proxy_pass http://push:10005;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 80;
    server_name sync.relivewp.net;
    proxy_read_timeout 24h;
    location / {
      if ($eas_cors_preflight) {
        add_header Access-Control-Allow-Origin  $eas_cors_origin always;
        add_header Vary                         "Origin" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, MS-ASProtocolVersion, MS-ASAcceptMultiPart, X-MS-PolicyKey" always;
        add_header Access-Control-Max-Age       "86400" always;
        return 204;
      }

      add_header Access-Control-Allow-Origin   $eas_cors_origin always;
      add_header Vary                          "Origin" always;
      add_header Access-Control-Expose-Headers $eas_cors_expose always;

      proxy_pass http://exchange:10008;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 80;
    server_name relivewp.net;
    location / {
      proxy_pass http://web:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 80;
    server_name mail.relivewp.net;
    location / {
      proxy_pass http://webmail:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 80;
    server_name zest.int.relivewp.net catalog.zest.int.relivewp.net;
    location / {
      proxy_pass http://catalog:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 80;
    server_name login.zest.int.relivewp.net;
    location / {
      proxy_pass http://zunelogin:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
      server_name image.catalog.zest.int.relivewp.net;
      listen 80; listen [::]:80;
      location / {
        proxy_pass http://catalog-image:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }
  }

  server {
      server_name commerce.zest.int.relivewp.net;
      listen 80; listen [::]:80;
      location / {
        proxy_pass http://commerce:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }
  }

  server {
      server_name inbox.zest.int.relivewp.net;
      listen 80; listen [::]:80;
      location / {
        proxy_pass http://inbox:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }
  }

  server {
      server_name mix.zest.int.relivewp.net;
      listen 80; listen [::]:80;
      location / {
        proxy_pass http://mix:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }
  }

  server {
      server_name social.zest.int.relivewp.net;
      listen 80; listen [::]:80;
      location / {
        proxy_pass http://socialapi:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }
  }

  server {
      server_name tuners.zest.int.relivewp.net;
      listen 80; listen [::]:80;
      location / {
        proxy_pass http://tuners:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }
  }
}
