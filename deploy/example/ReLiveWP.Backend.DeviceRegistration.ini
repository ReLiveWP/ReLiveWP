[Kestrel:Endpoints:Https]
Url=http://0.0.0.0:5000
Protocols=Http2

[Kestrel:Endpoints:Health]
Url=http://0.0.0.0:5001
Protocols=Http1

; ConnectionStrings:DefaultConnection is supplied via the ConnectionStrings__DefaultConnection docker secret

[CertificateGeneration]
RootCACertFile=/certs/provisioning_ca.pfx

; false lets any activation code through. to check them, replace this section with `ReLiveWP.ProductKeys.Cli print-ini`
[ProductKeys]
Required=false
