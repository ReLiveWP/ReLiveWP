---
name: relivewp

x-svc-env:
  &v-env
  ASPNETCORE_ENVIRONMENT: Container
  HOME: /home/app

x-healthcheck:
  &healthcheck
  interval: 120s
  timeout: 3s
  retries: 3
  start_period: 30s   # covers EF Database.Migrate() at boot without counting failures

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: relive
      POSTGRES_DB: relive
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    networks:
      - relive
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-create-databases.sql:ro
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relive"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    networks:
      - relive
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:alpine
    networks:
      - relive
    ports:
      - "8086:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      login:
        condition: service_healthy
      devices:
        condition: service_healthy
      web:
        condition: service_healthy
      activity:
        condition: service_healthy
      findmyphone:
        condition: service_healthy
      push:
        condition: service_healthy
      support:
        condition: service_healthy

  identity:
    image: relive/identity
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5001/health"]
    environment: *v-env
    networks:
      - relive
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Backend.Identity.ini:/app/ReLiveWP.Backend.Identity.ini:ro
      - ./deploy/data/identity/certstore:/home/app/.dotnet/corefx/cryptography/x509stores
      - ./deploy/certs/identity_ca.pfx:/certs/identity_ca.pfx:ro
      - ./deploy/certs/root_ca.pfx:/certs/root_ca.pfx:ro
    secrets:
      - source: jwt_private_key
        target: JWT__PrivateKey
      - source: passport_sts_key
        target: Passport__StsKey
      - source: identity_ca_password
        target: CertificateGeneration__CACertPassword
      - source: root_ca_password
        target: CertificateGeneration__RootCACertPassword
      - source: identity_db_connection
        target: ConnectionStrings__DefaultConnection

  connectedservices:
    image: relive/connectedservices
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5001/health"]
    environment: *v-env
    networks:
      - relive
    depends_on:
      identity:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Backend.ConnectedServices.ini:/app/ReLiveWP.Backend.ConnectedServices.ini:ro
    secrets:
      - source: connectedservices_db_connection
        target: ConnectionStrings__DefaultConnection
      - source: connection_secret_key
        target: ConnectedServices__Secrets__ConnectionKey

  deviceregistration:
    image: relive/deviceregistration
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5001/health"]
    environment: *v-env
    networks:
      - relive
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Backend.DeviceRegistration.ini:/app/ReLiveWP.Backend.DeviceRegistration.ini:ro
      - ./deploy/data/deviceregistration/certstore:/home/app/.dotnet/corefx/cryptography/x509stores
      - ./deploy/certs/provisioning_ca.pfx:/certs/provisioning_ca.pfx:ro
    secrets:
      - source: provisioning_ca_password
        target: CertificateGeneration__RootCACertPassword
      - source: deviceregistration_db_connection
        target: ConnectionStrings__DefaultConnection

  skybox:
    image: relive/skybox
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5001/health"]
    environment: *v-env
    networks:
      - relive
    depends_on:
      identity:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Backend.Skybox.ini:/app/ReLiveWP.Backend.Skybox.ini:ro
    secrets:
      - source: skybox_db_connection
        target: ConnectionStrings__DefaultConnection

  skydrive:
    image: relive/skydrive
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5001/health"]
    environment: *v-env
    networks:
      - relive
    depends_on:
      identity:
        condition: service_healthy
      connectedservices:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Backend.SkyDrive.ini:/app/ReLiveWP.Backend.SkyDrive.ini:ro
    secrets:
      - source: skydrive_db_connection
        target: ConnectionStrings__DefaultConnection

  mailbox:
    image: relive/mailbox
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5001/health"]
    environment: *v-env
    networks:
      - relive
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      identity:
        condition: service_healthy
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Backend.Mailbox.ini:/app/ReLiveWP.Backend.Mailbox.ini:ro
    secrets:
      - source: mailbox_db_connection
        target: ConnectionStrings__DefaultConnection

  activation:
    image: relive/activation
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10000/health"]
    environment: *v-env
    networks:
      - relive
    depends_on:
      deviceregistration:
        condition: service_healthy
    ports:
      - 10000:10000
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Services.Activation.ini:/app/ReLiveWP.Services.Activation.ini:ro

  login:
    image: relive/login
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10002/health"]
    environment: *v-env
    networks:
      - relive
    depends_on:
      identity:
        condition: service_healthy
      connectedservices:
        condition: service_healthy
      deviceregistration:
        condition: service_healthy
    ports:
      - 10002:10002
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Services.Login.ini:/app/ReLiveWP.Services.Login.ini:ro
    secrets:
      - source: jwt_public_key
        target: JWT__PublicKey

  web:
    image: relive/web
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
    environment: *v-env
    networks:
      - relive
    ports:
      - 10004:8080
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Web.Server.ini:/app/ReLiveWP.Web.Server.ini:ro

  push:
    image: relive/push
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10005/health"]
    environment:
      ASPNETCORE_ENVIRONMENT: Container
      HOME: /home/app
      OPENSSL_CONF: /app/openssl.cnf
    networks:
      - relive
    depends_on:
      identity:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - 10005:10005
      - 0.0.0.0:33573:33573
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Services.Push.ini:/app/ReLiveWP.Services.Push.ini:ro
      - ./deploy/certs/push.pfx:/certs/push.pfx:ro
      - ./docker/push-openssl.cnf:/app/openssl.cnf:ro
    secrets:
      - source: push_cert_password
        target: Push__ServerCertPassword
      - source: push_db_connection
        target: ConnectionStrings__Push

  activity:
    image: relive/activity
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10007/health"]
    environment: *v-env
    networks:
      - relive
    depends_on:
      identity:
        condition: service_healthy
      connectedservices:
        condition: service_healthy
      skydrive:
        condition: service_healthy
    ports:
      - 10007:10007
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Services.Activity.ini:/app/ReLiveWP.Services.Activity.ini:ro
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 0o01777
    secrets:
      - source: jwt_public_key
        target: JWT__PublicKey

  docs:
    image: relive/docs
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10016/health"]
    environment: *v-env
    networks:
      - relive
    depends_on:
      identity:
        condition: service_healthy
      connectedservices:
        condition: service_healthy
      skydrive:
        condition: service_healthy
    ports:
      - 10016:10016
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Services.Docs.ini:/app/ReLiveWP.Services.Docs.ini:ro
    secrets:
      - source: jwt_public_key
        target: JWT__PublicKey

  exchange:
    image: relive/exchange
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10008/health"]
    environment: *v-env
    networks:
      - relive
    depends_on:
      identity:
        condition: service_healthy
      mailbox:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - 10008:10008
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Services.Exchange.ini:/app/ReLiveWP.Services.Exchange.ini:ro

  addressbook:
    image: relive/addressbook
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10010/health"]
    environment: *v-env
    networks:
      - relive
    depends_on:
      identity:
        condition: service_healthy
    ports:
      - 10010:10010
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Services.AddressBook.ini:/app/ReLiveWP.Services.AddressBook.ini:ro
    secrets:
      - source: jwt_public_key
        target: JWT__PublicKey

  profile:
    image: relive/profile
    environment: *v-env
    networks:
      - relive
    depends_on:
      - identity
    ports:
      - 10014:10014
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Services.Profile.ini:/app/ReLiveWP.Services.Profile.ini:ro

  devices:
    image: relive/devices
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10011/health"]
    environment: *v-env
    networks:
      - relive
    depends_on:
      skybox:
        condition: service_healthy
      identity:
        condition: service_healthy
    ports:
      - 10011:10011
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Services.Devices.ini:/app/ReLiveWP.Services.Devices.ini:ro
    secrets:
      - source: jwt_public_key
        target: JWT__PublicKey

  findmyphone:
    image: relive/findmyphone
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10012/health"]
    environment: *v-env
    networks:
      - relive
    depends_on:
      skybox:
        condition: service_healthy
      identity:
        condition: service_healthy
    ports:
      - 10012:10012
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Services.FindMyPhone.ini:/app/ReLiveWP.Services.FindMyPhone.ini:ro
    secrets:
      - source: jwt_public_key
        target: JWT__PublicKey

  appserver:
    image: relive/appserver
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10018/health"]
    environment: *v-env
    networks:
      - relive
    ports:
      - 10018:10018
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Services.AppServer.ini:/app/ReLiveWP.Services.AppServer.ini:ro

  orion:
    image: relive/orion
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10013/health"]
    environment: *v-env
    networks:
      - relive
    ports:
      - 10013:10013
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Services.Orion.ini:/app/ReLiveWP.Services.Orion.ini:ro
    secrets:
      - source: api_key_geolocation
        target: Orion__InferenceApiKey

  messenger:
    image: relive/messenger
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10015/health"]
    environment: *v-env
    networks:
      - relive
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - 10015:10015
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Services.Messenger.ini:/app/ReLiveWP.Services.Messenger.ini:ro

  support:
    image: relive/support
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10017/alive"]
    environment: *v-env
    networks:
      - relive
    ports:
      - 10017:10017
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Services.Support.ini:/app/ReLiveWP.Services.Support.ini:ro

networks:
  relive:
    name: relive
    driver: bridge

volumes:
  postgres_data:
  redis_data:

secrets:
  jwt_private_key:
    file: ./deploy/secrets/jwt_private_key
  jwt_public_key:
    file: ./deploy/secrets/jwt_public_key
  passport_sts_key:
    file: ./deploy/secrets/passport_sts_key
  identity_ca_password:
    file: ./deploy/secrets/identity_ca_password
  root_ca_password:
    file: ./deploy/secrets/root_ca_password
  provisioning_ca_password:
    file: ./deploy/secrets/provisioning_ca_password
  push_cert_password:
    file: ./deploy/secrets/push_cert_password
  api_key_geolocation:
    file: ./deploy/api_keys/geolocation
  postgres_password:
    file: ./deploy/secrets/postgres_password
  identity_db_connection:
    file: ./deploy/secrets/identity_db_connection
  connectedservices_db_connection:
    file: ./deploy/secrets/connectedservices_db_connection
  connection_secret_key:
    file: ./deploy/secrets/connection_secret_key
  deviceregistration_db_connection:
    file: ./deploy/secrets/deviceregistration_db_connection
  skybox_db_connection:
    file: ./deploy/secrets/skybox_db_connection
  skydrive_db_connection:
    file: ./deploy/secrets/skydrive_db_connection
  push_db_connection:
    file: ./deploy/secrets/push_db_connection
  mailbox_db_connection:
    file: ./deploy/secrets/mailbox_db_connection
