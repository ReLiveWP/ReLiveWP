  appserver:
    image: ${RELIVE_REGISTRY:-relive}/appserver:${RELIVE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10019/health"]
    environment: *v-env
    networks:
      - relive
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Services.AppServer.ini:/app/ReLiveWP.Services.AppServer.ini:ro

  orion:
    image: ${RELIVE_REGISTRY:-relive}/orion:${RELIVE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10013/health"]
    environment: *v-env
    networks:
      - relive
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Services.Orion.ini:/app/ReLiveWP.Services.Orion.ini:ro
    secrets:
      - source: api_key_geolocation
        target: Orion__InferenceApiKey

  messenger:
    image: ${RELIVE_REGISTRY:-relive}/messenger:${RELIVE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10015/health"]
    environment: *v-env
    networks:
      - relive
    depends_on:
      redis:
        condition: service_healthy
      chat:
        condition: service_healthy
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Services.Messenger.ini:/app/ReLiveWP.Services.Messenger.ini:ro

  chat:
    image: ${RELIVE_REGISTRY:-relive}/chat:${RELIVE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5001/health"]
    environment: *v-env
    networks:
      - relive
    depends_on:
      redis:
        condition: service_healthy
      mailbox:
        condition: service_healthy
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Backend.Chat.ini:/app/ReLiveWP.Backend.Chat.ini:ro

  support:
    image: ${RELIVE_REGISTRY:-relive}/support:${RELIVE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10017/alive"]
    environment: *v-env
    networks:
      - relive
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Services.Support.ini:/app/ReLiveWP.Services.Support.ini:ro

  mediaproxy:
    image: ${RELIVE_REGISTRY:-relive}/mediaproxy:${RELIVE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10021/health"]
    environment: *v-env
    networks:
      - relive
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Services.MediaProxy.ini:/app/ReLiveWP.Services.MediaProxy.ini:ro
    secrets:
