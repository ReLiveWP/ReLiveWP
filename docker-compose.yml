    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Services.Hub.ini:/app/ReLiveWP.Services.Hub.ini:ro
    secrets:
      - source: jwt_public_key
        target: JWT__PublicKey

  devices:
    image: ${RELIVE_REGISTRY:-relive}/devices:${RELIVE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10011/health"]
    environment: *v-env
    networks:
      - relive
    depends_on:
      skybox:
        condition: service_healthy
      identity:
        condition: service_healthy
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Services.Devices.ini:/app/ReLiveWP.Services.Devices.ini:ro
    secrets:
      - source: jwt_public_key
        target: JWT__PublicKey

  findmyphone:
