    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10020/health"]
    environment: *v-env
    networks:
      - relive
    depends_on:
      identity:
        condition: service_healthy
      clearinghouse:
