    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10012/health"]
    environment: *v-env
    networks:
      - relive
    depends_on:
      skybox:
