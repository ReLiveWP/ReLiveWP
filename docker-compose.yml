---
name: relivewp

x-svc-env:
  &v-env
  ASPNETCORE_ENVIRONMENT: Container
  HOME: /home/app

x-healthcheck:
  &healthcheck
  interval: 120s
  timeout: 3s
  retries: 3
  start_period: 30s  

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: relive
      POSTGRES_DB: relive
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    networks:
      - relive
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-create-databases.sql:ro
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relive"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - relive
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    networks:
      - relive
    ports:
      - "8086:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      login:
        condition: service_healthy
      devices:
        condition: service_healthy
      web:
        condition: service_healthy
      activity:
        condition: service_healthy
      findmyphone:
        condition: service_healthy
      push:
        condition: service_healthy
      support:
        condition: service_healthy

  identity:
    image: ${RELIVE_REGISTRY:-relive}/identity:${RELIVE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5001/health"]
    environment: *v-env
    networks:
      - relive
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Backend.Identity.ini:/app/ReLiveWP.Backend.Identity.ini:ro
      - ./deploy/data/identity/certstore:/home/app/.dotnet/corefx/cryptography/x509stores
      - ./deploy/data/identity/avatars:/data/avatars
      - ./deploy/certs/identity_ca.pfx:/certs/identity_ca.pfx:ro
      - ./deploy/certs/root_ca.pfx:/certs/root_ca.pfx:ro
    secrets:
      - source: jwt_private_key
        target: JWT__PrivateKey
      - source: passport_sts_key
        target: Passport__StsKey
      - source: identity_ca_password
        target: CertificateGeneration__CACertPassword
      - source: root_ca_password
        target: CertificateGeneration__RootCACertPassword
      - source: identity_db_connection
        target: ConnectionStrings__DefaultConnection

  connectedservices:
    image: ${RELIVE_REGISTRY:-relive}/connectedservices:${RELIVE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5001/health"]
    environment: *v-env
    networks:
      - relive
    depends_on:
      identity:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Backend.ConnectedServices.ini:/app/ReLiveWP.Backend.ConnectedServices.ini:ro
    secrets:
      - source: connectedservices_db_connection
        target: ConnectionStrings__DefaultConnection
      - source: connection_secret_key
        target: ConnectedServices__Secrets__ConnectionKey

  deviceregistration:
    image: ${RELIVE_REGISTRY:-relive}/deviceregistration:${RELIVE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5001/health"]
    environment: *v-env
    networks:
      - relive
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Backend.DeviceRegistration.ini:/app/ReLiveWP.Backend.DeviceRegistration.ini:ro
      - ./deploy/data/deviceregistration/certstore:/home/app/.dotnet/corefx/cryptography/x509stores
      - ./deploy/certs/provisioning_ca.pfx:/certs/provisioning_ca.pfx:ro
    secrets:
      - source: provisioning_ca_password
        target: CertificateGeneration__RootCACertPassword
      - source: deviceregistration_db_connection
        target: ConnectionStrings__DefaultConnection

  skybox:
    image: ${RELIVE_REGISTRY:-relive}/skybox:${RELIVE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5001/health"]
    environment: *v-env
    networks:
      - relive
    depends_on:
      identity:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Backend.Skybox.ini:/app/ReLiveWP.Backend.Skybox.ini:ro
    secrets:
      - source: skybox_db_connection
        target: ConnectionStrings__DefaultConnection

  clearinghouse:
    image: ${RELIVE_REGISTRY:-relive}/clearinghouse:${RELIVE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5001/health"]
    environment: *v-env
    networks:
      - relive
    depends_on:
      identity:
        condition: service_healthy
      connectedservices:
        condition: service_healthy
      mailbox:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Backend.ClearingHouse.ini:/app/ReLiveWP.Backend.ClearingHouse.ini:ro
    secrets:
      - source: clearinghouse_db_connection
        target: ConnectionStrings__DefaultConnection

  skydrive:
    image: ${RELIVE_REGISTRY:-relive}/skydrive:${RELIVE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5001/health"]
    environment: *v-env
    networks:
      - relive
    depends_on:
      identity:
        condition: service_healthy
      connectedservices:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Backend.SkyDrive.ini:/app/ReLiveWP.Backend.SkyDrive.ini:ro
    secrets:
      - source: skydrive_db_connection
        target: ConnectionStrings__DefaultConnection

  mailbox:
    image: ${RELIVE_REGISTRY:-relive}/mailbox:${RELIVE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5001/health"]
    environment: *v-env
    networks:
      - relive
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      identity:
        condition: service_healthy
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Backend.Mailbox.ini:/app/ReLiveWP.Backend.Mailbox.ini:ro
    secrets:
      - source: mailbox_db_connection
        target: ConnectionStrings__DefaultConnection

  mail:
    image: ${RELIVE_REGISTRY:-relive}/mail:${RELIVE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5001/health"]
    environment: *v-env
    networks:
      - relive
    depends_on:
      redis:
        condition: service_healthy
      identity:
        condition: service_healthy
      mailbox:
        condition: service_healthy
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Backend.Mail.ini:/app/ReLiveWP.Backend.Mail.ini:ro

  deviceupdate:
    image: ${RELIVE_REGISTRY:-relive}/deviceupdate:${RELIVE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10004/health"]
    environment: *v-env
    networks:
      - relive
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Backend.DeviceUpdate.ini:/app/ReLiveWP.Backend.DeviceUpdate.ini:ro
      - ./deploy/data/deviceupdate/wwwroot:/app/wwwroot:ro
      - ./deploy/data/deviceupdate/catalog:/app/Catalog:ro
      - ./deploy/data/deviceupdate/packages:/app/Packages
    secrets:
      - source: deviceupdate_db_connection
        target: ConnectionStrings__DefaultConnection

  activation:
    image: ${RELIVE_REGISTRY:-relive}/activation:${RELIVE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10000/health"]
    environment: *v-env
    networks:
      - relive
    depends_on:
      deviceregistration:
        condition: service_healthy
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Services.Activation.ini:/app/ReLiveWP.Services.Activation.ini:ro

  login:
    image: ${RELIVE_REGISTRY:-relive}/login:${RELIVE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10002/health"]
    environment: *v-env
    networks:
      - relive
    depends_on:
      identity:
        condition: service_healthy
      connectedservices:
        condition: service_healthy
      deviceregistration:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Services.Login.ini:/app/ReLiveWP.Services.Login.ini:ro
      - ./deploy/certs/provisioning_ca.crt:/certs/provisioning_ca.crt:ro
    secrets:
      - source: jwt_public_key
        target: JWT__PublicKey
      - source: signup_key_0
        target: Signup__Keys__0__PrivateKey

  web:
    image: ${RELIVE_REGISTRY:-relive}/web:${RELIVE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
    environment: *v-env
    networks:
      - relive
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro

  webmail:
    image: ${RELIVE_REGISTRY:-relive}/webmail:${RELIVE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
    environment: *v-env
    networks:
      - relive
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro

  push:
    image: ${RELIVE_REGISTRY:-relive}/push:${RELIVE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10005/health"]
    environment:
      ASPNETCORE_ENVIRONMENT: Container
      HOME: /home/app
      OPENSSL_CONF: /app/openssl.cnf
    networks:
      - relive
    depends_on:
      identity:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - 0.0.0.0:33573:33573   # raw nsp socket, must be accessible
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Services.Push.ini:/app/ReLiveWP.Services.Push.ini:ro
      - ./deploy/certs/push.pfx:/certs/push.pfx:ro
      - ./docker/push-openssl.cnf:/app/openssl.cnf:ro
    secrets:
      - source: push_cert_password
        target: Push__ServerCertPassword
      - source: push_db_connection
        target: ConnectionStrings__Push

  activity:
    image: ${RELIVE_REGISTRY:-relive}/activity:${RELIVE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10007/health"]
    environment: *v-env
    networks:
      - relive
    depends_on:
      identity:
        condition: service_healthy
      connectedservices:
        condition: service_healthy
      skydrive:
        condition: service_healthy
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Services.Activity.ini:/app/ReLiveWP.Services.Activity.ini:ro
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 0o01777
    secrets:
      - source: jwt_public_key
        target: JWT__PublicKey
      - source: media_ticket_secret
        target: Media__TicketSecret
      - source: media_proxy_key
        target: Media__ProxyKeys__v1

  docs:
    image: ${RELIVE_REGISTRY:-relive}/docs:${RELIVE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10016/health"]
    environment: *v-env
    networks:
      - relive
    depends_on:
      identity:
        condition: service_healthy
      connectedservices:
        condition: service_healthy
      skydrive:
        condition: service_healthy
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Services.Docs.ini:/app/ReLiveWP.Services.Docs.ini:ro
    secrets:
      - source: jwt_public_key
        target: JWT__PublicKey

  exchange:
    image: ${RELIVE_REGISTRY:-relive}/exchange:${RELIVE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10008/health"]
    environment: *v-env
    networks:
      - relive
    depends_on:
      identity:
        condition: service_healthy
      mailbox:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Services.Exchange.ini:/app/ReLiveWP.Services.Exchange.ini:ro
    secrets:
      - source: jwt_public_key
        target: JWT__PublicKey

  addressbook:
    image: ${RELIVE_REGISTRY:-relive}/addressbook:${RELIVE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10010/health"]
    environment: *v-env
    networks:
      - relive
    depends_on:
      identity:
        condition: service_healthy
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Services.AddressBook.ini:/app/ReLiveWP.Services.AddressBook.ini:ro
    secrets:
      - source: jwt_public_key
        target: JWT__PublicKey

  profile:
    image: ${RELIVE_REGISTRY:-relive}/profile:${RELIVE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10014/health"]
    environment: *v-env
    networks:
      - relive
    depends_on:
      identity:
        condition: service_healthy
    volumes:
      - ./deploy/services.ini:/app/services.ini:ro
      - ./deploy/certs/trust:/usr/local/share/ca-certificates/relive:ro
      - ./deploy/ReLiveWP.Services.Profile.ini:/app/ReLiveWP.Services.Profile.ini:ro

  hub:
